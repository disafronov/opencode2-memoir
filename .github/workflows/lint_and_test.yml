name: Lint and test

"on":
  pull_request:
    branches:
      - main
      - rc

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        run: npm run lint

      - name: Run typecheck
        run: npm run typecheck

  test:
    name: "Test (Node ${{ matrix.node-version }})"
    needs: lint
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      matrix:
        node-version: [24, 26]
      fail-fast: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install uv and Memoir
        uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install Memoir
        if: matrix.node-version == 24
        run: |
          uv tool install --python 3.13 "memoir-ai[mcp]==0.2.9"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          "$HOME/.local/bin/memoir-mcp" --version

      - name: Install OpenCode V2
        if: matrix.node-version == 24
        run: |
          npm install --no-save --ignore-scripts @opencode/cli-linux-x64@2.4.1
          node_modules/@opencode/cli-linux-x64/bin/opencode --version

      - name: Run unit tests
        run: npm run test:unit

      - name: Run integration tests
        if: matrix.node-version == 24
        env:
          OPENCODE_BIN: ${{ github.workspace }}/node_modules/@opencode/cli-linux-x64/bin/opencode
        run: npm run test:integration

      - name: Validate package contents
        if: matrix.node-version == 24
        run: npm run test:package
